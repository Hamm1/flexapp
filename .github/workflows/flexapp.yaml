name: flexapp

on:
  push:
    branches:
      - 'main'
    tags:
      - "release-v[0-9]+.[0-9]+.[0-9]+"
      - "release-v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  testing:
    strategy:
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.optimize }}
      - run: zig test src/root.zig -O${{ matrix.optimize }}

  prepare:
    name: Prepare release metadata
    runs-on: 'ubuntu-latest'
    needs: testing
    env:
      TRIGGER_TAG: ${{ github.ref }}
      TRIGGER_TAG_NAME: ${{ github.ref_name }}
      GIT_USERNAME: hamm1
      GIT_EMAIL: mlhambright1@gmail.com

    outputs:
      release_tag: ${{ steps.compute_tag.outputs.release_tag }}
      is_pre_release: ${{ steps.compute_tag.outputs.is_pre_release }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Git author information
        run: |
          git config --global user.email "${GIT_EMAIL}"
          git config --global user.name "${GIT_USERNAME}"
      
      - name: Compute release tag
        id: compute_tag
        run: |
          set -xue
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Triggered by tag push: ${GITHUB_REF}"
            RELEASE_TAG="${GITHUB_REF#*release-}"
          else
            echo "Triggered by main push"
            latest_tag=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
            echo "Latest published tag is: $latest_tag"
            if [ -z "$latest_tag" ]; then
              new_version="0.0.1"
            else
              version=${latest_tag#v}
              IFS='.' read -r major minor patch <<< "$version"
              patch=$((patch + 1))
              new_version="${major}.${minor}.${patch}"
            fi
            RELEASE_TAG="v${new_version}"
          fi

          IS_PRE_RELEASE=false
          if echo "${RELEASE_TAG}" | grep -E -- '-rc[0-9]+$'; then
            IS_PRE_RELEASE=true
          fi

          if [[ -n $(git tag -l | grep -E -- '^'${RELEASE_TAG}) ]]; then
            echo "::error::Release tag ${RELEASE_TAG} already exists"
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_pre_release=${IS_PRE_RELEASE}" >> $GITHUB_OUTPUT

      - name: Creating the release tag
        run: |
          echo "Creating release tag ${{ steps.compute_tag.outputs.release_tag }}"
          git tag ${{ steps.compute_tag.outputs.release_tag }}
          git push origin ${{ steps.compute_tag.outputs.release_tag }}

      - name: Deleting pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Deleting pushed tag ${TRIGGER_TAG_NAME}"
          git tag -d ${TRIGGER_TAG_NAME}
          git push -d origin ${TRIGGER_TAG_NAME}

  build:
    needs: prepare
    strategy:
      matrix:
        job: [linux, windows]
    
    runs-on: ubuntu-latest
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Dagger Linux
        if: matrix.job == 'linux'
        run: |
          sudo apt update && sudo apt install curl unzip wget
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          export PATH="$HOME/.local/bin:$PATH"
          cd .ci
          dagger call linux --src=../ export --path="$(dirname $(pwd))/exe/flexapp"

      - name: Dagger Windows
        if: matrix.job == 'windows'
        run: |
          sudo apt update && sudo apt install curl unzip wget
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          export PATH="$HOME/.local/bin:$PATH"
          cd .ci
          dagger call windows --src=../ export --path="$(dirname $(pwd))/exe/flexapp.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-binary
          path: ./exe/flexapp${{ matrix.job == 'windows' && '.exe' || '' }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_pre_release }}
          files: |
            ./artifacts/linux-binary/flexapp
            ./artifacts/windows-binary/flexapp.exe